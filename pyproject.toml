[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "high-beta-analysis"
version = "0.1.0"
description = "Time-aware machine-learning analysis of extreme-move risk in AI-infrastructure equities"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "PyYAML>=6,<7",
  "joblib>=1.3,<2",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
market = ["yfinance>=0.2.50,<2"]
nlp = ["torch>=2.2,<3", "transformers>=4.40,<6"]
regimes = ["scipy>=1.11,<2"]
explain = ["shap>=0.45,<1"]
app = ["streamlit>=1.35,<2"]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]

[project.scripts]
high-beta = "high_beta_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
