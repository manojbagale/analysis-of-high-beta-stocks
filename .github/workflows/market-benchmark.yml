name: Historical Market Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install -e ".[dev,market,regimes]"
      - name: Verify modeling tests
        run: python -m pytest -q
      - name: Download, audit and evaluate historical prices
        run: |
          mkdir -p reports/real-market-pilot
          python scripts/run_market_study.py --out reports/real-market-pilot 2>&1 | tee reports/real-market-pilot/console.log
      - name: Attach private-run data and diagnostics to Actions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-benchmark-run
          path: reports/real-market-pilot/
          retention-days: 7
          if-no-files-found: warn
