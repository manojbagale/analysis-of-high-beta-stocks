name: Recent Financial News Pilot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FinBERT dependencies
        run: python -m pip install -e ".[dev,nlp,market]"
      - name: Unit tests
        run: python -m pytest -q tests/test_news.py tests/test_news_gdelt.py
      - name: Acquire recent first-seen headlines and score with FinBERT
        run: |
          mkdir -p reports/recent-news-pilot
          python scripts/run_news_pilot.py --tickers IREN NBIS --days 45 --maxrecords 75 2>&1 | tee reports/recent-news-pilot/console.log
      - name: Preserve short-lived pilot outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finbert-recent-headline-pilot
          path: reports/recent-news-pilot/
          retention-days: 2
          if-no-files-found: warn
